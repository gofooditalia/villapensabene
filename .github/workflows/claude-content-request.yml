name: Claude Content Request

# Pipeline del pilota "modifiche via WhatsApp" (vedi CLAUDE.md).
#
# Trigger: una issue aperta con la label "whatsapp-request" (la apre
# app/api/whatsapp-webhook/route.ts quando il titolare scrive sul numero
# business; aggiunge anche una label "wa-sender-<numero>" per sapere a chi
# rispondere a fine lavoro).
#
# NESSUNA approvazione umana: scelta esplicita del titolare — la modifica,
# se passa i controlli automatici (diff isolato al solo file dati +
# typecheck), viene mergiata e pubblicata senza intervento manuale. Il
# titolare riceve solo una notifica finale su WhatsApp, non un link da
# approvare.
#
# Garanzia strutturale, non solo scritta in CLAUDE.md: Claude Code gira in
# uno step che NON ha accesso a git/gh — può solo leggere il repo e
# modificare data/site.config.ts. Un passo successivo, bash puro e
# deterministico, verifica che il working tree sia toccato SOLO in quel
# file prima di committare/pushare/aprire la PR. Se Claude ha toccato
# qualunque altra cosa (o ha provato a crearne di nuove), il job fallisce
# e non viene aperta nessuna PR — questo è l'UNICO controllo rimasto prima
# della pubblicazione, dato che non c'è più revisione umana.
#
# Canali: la issue può arrivare da WhatsApp (label "whatsapp-request" +
# "wa-sender-<numero>", da app/api/whatsapp-webhook/route.ts) o da Telegram
# (label "telegram-request" + "tg-sender-<chat id>", da
# app/api/telegram-webhook/route.ts). La pipeline è identica, cambia solo
# il canale della notifica finale.
#
# Secret richiesti (oltre a CLAUDE_CODE_OAUTH_TOKEN, già presente):
# - WHATSAPP_ACCESS_TOKEN, WHATSAPP_PHONE_NUMBER_ID — stessi valori già
#   su Vercel, copiati qui per permettere alla Action di notificare il
#   titolare su WhatsApp a fine lavoro.
# - TELEGRAM_BOT_TOKEN — stesso valore su Vercel, per le notifiche Telegram.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-content-request-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  apply-content-change:
    if: >-
      contains(github.event.issue.labels.*.name, 'whatsapp-request') ||
      contains(github.event.issue.labels.*.name, 'telegram-request')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Estrai il numero del mittente dalla label
        id: sender
        env:
          ISSUE_LABELS_JSON: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          SENDER=$(echo "$ISSUE_LABELS_JSON" | grep -oE '"wa-sender-[0-9]+"' | head -1 | grep -oE '[0-9]+' || true)
          TG_CHAT=$(echo "$ISSUE_LABELS_JSON" | grep -oE '"tg-sender-[0-9]+"' | head -1 | grep -oE '[0-9]+' || true)
          if [ -n "$SENDER" ]; then
            echo "phone=+$SENDER" >> "$GITHUB_OUTPUT"
          else
            echo "phone=" >> "$GITHUB_OUTPUT"
          fi
          echo "tg_chat=$TG_CHAT" >> "$GITHUB_OUTPUT"
          if [ -z "$SENDER" ] && [ -z "$TG_CHAT" ]; then
            echo "::warning::Nessuna label wa-sender-*/tg-sender-*: issue aperta a mano, niente notifiche per questa run."
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installa dipendenze (per il typecheck di sicurezza)
        run: pnpm install --frozen-lockfile

      - name: Crea branch dedicato
        id: branch
        run: |
          BRANCH="content/issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Claude applica la richiesta (nessun accesso a git/gh)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Questa è una richiesta di modifica contenuto arrivata da un
            cliente (ristoratore) via WhatsApp, registrata come issue
            GitHub in questo repo.

            Titolo issue: ${{ github.event.issue.title }}

            Corpo issue (richiesta originale del cliente, testo o
            trascrizione del vocale):
            ${{ github.event.issue.body }}

            Leggi PRIMA il file CLAUDE.md nella root del repo e segui
            ESATTAMENTE le sue regole, senza eccezioni e senza
            improvvisare oltre quello che dice.

            Non hai accesso a git o gh in questo step: non provare a
            usarli. Il tuo unico compito è decidere se e come modificare
            data/site.config.ts, e scriverlo (un commit/PR/merge li fa
            uno step successivo del workflow, non tu). NON c'è più
            revisione umana prima della pubblicazione: se applichi una
            modifica, va in produzione in pochi minuti. Sii ancora più
            prudente del solito nel Caso B qui sotto.

            Caso A — richiesta chiara, permessa dalle regole di CLAUDE.md,
            riguarda solo valori modificabili in data/site.config.ts:
            applica la modifica in quel file. Non toccare nessun altro
            file, non crearne di nuovi nel repo.

            Caso B — richiesta ambigua, fuori dallo schema esistente,
            o che tocca un campo vietato (telefono, WhatsApp, P.IVA):
            NON modificare data/site.config.ts.

            In ENTRAMBI i casi, scrivi alla fine un riassunto TECNICO in
            italiano in /tmp/claude-outcome.md (fuori dal repo, non
            tracciato da git):
            - Caso A: cosa hai cambiato e perché, pronto per essere usato
              come descrizione della PR (lo leggerà solo chi guarda la
              cronologia Git, non il cliente).
            - Caso B: perché non hai proceduto e cosa serve.

            SOLO nel Caso B, scrivi ANCHE un secondo file,
            /tmp/claude-whatsapp-message.md, con un messaggio DIVERSO:
            brevissimo (1-2 frasi), in italiano semplicissimo,
            comprensibile da chiunque (zero gergo tecnico, zero menzioni
            di GitHub/issue/PR/file), che spieghi al cliente — che lo
            leggerà su WhatsApp — che non hai capito bene la richiesta e
            gli chieda di riformularla in modo più semplice, con un
            esempio concreto pertinente alla sua richiesta. Esempio di
            tono: "Non ho capito bene la richiesta 🤔 Puoi riscrivermela
            in modo più semplice? Es: 'cambia il prezzo della Margherita
            a 9 euro'". Nel Caso A non serve: il messaggio di successo lo
            manda il workflow con un testo fisso.

            Se il messaggio NON è una richiesta di modifica ma un saluto
            o una domanda su cosa sai fare (es. "ciao", "sei operativo?",
            "cosa sai fare?"), il messaggio per il cliente non deve dire
            "non ho capito": deve presentarti come l'assistente che aiuta
            a modificare il sito villapensabene.it, citando SEMPRE
            esplicitamente "villapensabene.it", con 1-2 esempi concreti
            di richieste. Esempio di tono: "Ciao! 👋 Ti aiuto a cambiare
            il sito villapensabene.it: prezzi, piatti, orari, avvisi.
            Scrivimi o mandami un vocale, es: 'domenica siamo chiusi'".
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Edit,MultiEdit,Write"

      - name: Verifica che il diff tocchi SOLO data/site.config.ts
        id: guard
        run: |
          CHANGED=$(git status --porcelain=v1 | awk '{print $2}')
          if [ -z "$CHANGED" ]; then
            echo "Nessuna modifica applicata da Claude."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CHANGED" != "data/site.config.ts" ]; then
            echo "::error::Claude ha toccato file non permessi, PR NON aperta:"
            echo "$CHANGED"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Typecheck di sicurezza
        if: steps.guard.outputs.changed == 'true'
        run: pnpm exec tsc --noEmit

      - name: Leggi il riassunto scritto da Claude
        id: outcome
        run: |
          DELIM="CLAUDE_OUTCOME_$(openssl rand -hex 8)"
          {
            echo "body<<${DELIM}"
            if [ -f /tmp/claude-outcome.md ]; then
              cat /tmp/claude-outcome.md
            else
              echo "Claude non ha fornito una spiegazione scritta per questa richiesta."
            fi
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

          DELIM2="CLAUDE_WA_$(openssl rand -hex 8)"
          {
            echo "whatsapp_message<<${DELIM2}"
            if [ -f /tmp/claude-whatsapp-message.md ]; then
              cat /tmp/claude-whatsapp-message.md
            else
              echo "Non sono riuscito a capire bene la richiesta per il sito villapensabene.it 🤔 Puoi riscrivermela in modo più semplice?"
            fi
            echo "${DELIM2}"
          } >> "$GITHUB_OUTPUT"

      - name: Commit, push, apri e mergia la PR
        if: steps.guard.outputs.changed == 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ steps.outcome.outputs.body }}
          # Il titolo dell'issue è testo non fidato (arriva da un messaggio
          # WhatsApp): passarlo via env ed espanderlo come variabile bash
          # ($ISSUE_TITLE), non interpolarlo direttamente nello script,
          # evita che caratteri come backtick o $(...) vengano eseguiti
          # come shell invece di essere trattati come testo.
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.email "claude[bot]@users.noreply.github.com"
          git config user.name "claude[bot]"
          git add data/site.config.ts
          git commit -m "content: richiesta da issue #${ISSUE_NUMBER}" -m "$ISSUE_TITLE"
          git push origin "${{ steps.branch.outputs.branch }}"
          {
            echo "$PR_BODY"
            echo ""
            echo "---"
            echo "Richiesta originale: issue #${ISSUE_NUMBER}"
            echo "Pubblicata automaticamente, nessuna revisione umana (vedi CLAUDE.md)."
            echo ""
            echo "Closes #${ISSUE_NUMBER}"
          } > /tmp/pr-body.md
          gh pr create \
            --title "Contenuto: $ISSUE_TITLE" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "${{ steps.branch.outputs.branch }}"
          gh pr merge "${{ steps.branch.outputs.branch }}" --squash --delete-branch
          # "Closes #N" nel corpo della PR non chiude sempre l'issue in modo
          # affidabile quando il merge lo fa il bot delle Actions (osservato
          # empiricamente: funziona se il merge lo fa un utente reale, non
          # sempre se lo fa github-actions[bot]) — chiudiamo esplicitamente
          # invece di fidarci della sola parola magica.
          gh issue close "${ISSUE_NUMBER}"

      - name: Notifica WhatsApp - modifica pubblicata
        if: steps.guard.outputs.changed == 'true' && steps.sender.outputs.phone != ''
        env:
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          TO: ${{ steps.sender.outputs.phone }}
        run: |
          if [ -z "$WHATSAPP_ACCESS_TOKEN" ] || [ -z "$WHATSAPP_PHONE_NUMBER_ID" ]; then
            echo "::warning::Secret WhatsApp mancanti su questo repo, notifica non inviata."
            exit 0
          fi
          # --fail-with-body + controllo esito: se Meta rifiuta l'invio (token
          # scaduto, permessi, destinatario non autorizzato...) lo step va in
          # rosso e l'errore di Meta finisce nel log, invece di fallire in
          # silenzio con lo step verde.
          RESP=$(curl -sS --fail-with-body -X POST "https://graph.facebook.com/v21.0/${WHATSAPP_PHONE_NUMBER_ID}/messages" \
            -H "Authorization: Bearer ${WHATSAPP_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"messaging_product":"whatsapp","to":"'"${TO}"'","type":"text","text":{"body":"✅ Fatto! La tua modifica è online: https://www.villapensabene.it"}}') \
            || { echo "::error::Invio WhatsApp fallito: $RESP"; exit 1; }
          echo "Risposta Meta: $RESP"

      - name: Notifica Telegram - modifica pubblicata
        if: steps.guard.outputs.changed == 'true' && steps.sender.outputs.tg_chat != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ steps.sender.outputs.tg_chat }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::warning::Secret TELEGRAM_BOT_TOKEN mancante su questo repo, notifica non inviata."
            exit 0
          fi
          RESP=$(curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{"chat_id":'"${CHAT_ID}"',"text":"✅ Fatto! La tua modifica è online: https://www.villapensabene.it"}') \
            || { echo "::error::Invio Telegram fallito: $RESP"; exit 1; }
          echo "Risposta Telegram: $RESP"

      - name: "Nessuna modifica applicata: commenta sull'issue"
        if: steps.guard.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ steps.outcome.outputs.body }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "$COMMENT_BODY"

      - name: Notifica WhatsApp - richiesta non chiara
        if: steps.guard.outputs.changed == 'false' && steps.sender.outputs.phone != ''
        env:
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          TO: ${{ steps.sender.outputs.phone }}
          WA_MESSAGE: ${{ steps.outcome.outputs.whatsapp_message }}
        run: |
          if [ -z "$WHATSAPP_ACCESS_TOKEN" ] || [ -z "$WHATSAPP_PHONE_NUMBER_ID" ]; then
            echo "::warning::Secret WhatsApp mancanti su questo repo, notifica non inviata."
            exit 0
          fi
          BODY_JSON=$(printf '%s' "$WA_MESSAGE" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
          # Stesso controllo esito della notifica di successo (vedi sopra).
          RESP=$(curl -sS --fail-with-body -X POST "https://graph.facebook.com/v21.0/${WHATSAPP_PHONE_NUMBER_ID}/messages" \
            -H "Authorization: Bearer ${WHATSAPP_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"messaging_product":"whatsapp","to":"'"${TO}"'","type":"text","text":{"body":'"${BODY_JSON}"'}}') \
            || { echo "::error::Invio WhatsApp fallito: $RESP"; exit 1; }
          echo "Risposta Meta: $RESP"

      - name: Notifica Telegram - richiesta non chiara
        if: steps.guard.outputs.changed == 'false' && steps.sender.outputs.tg_chat != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ steps.sender.outputs.tg_chat }}
          TG_MESSAGE: ${{ steps.outcome.outputs.whatsapp_message }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::warning::Secret TELEGRAM_BOT_TOKEN mancante su questo repo, notifica non inviata."
            exit 0
          fi
          PAYLOAD=$(python3 -c 'import json,os; print(json.dumps({"chat_id": int(os.environ["CHAT_ID"]), "text": os.environ["TG_MESSAGE"]}))')
          RESP=$(curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD") \
            || { echo "::error::Invio Telegram fallito: $RESP"; exit 1; }
          echo "Risposta Telegram: $RESP"
