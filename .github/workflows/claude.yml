name: Claude Code

# Assistente manuale: menziona @claude in un commento di una issue o PR per
# farti aiutare da Claude Code su questo repo (debug, domande, modifiche
# puntuali con revisione tua). Separato dalla pipeline automatica delle
# richieste cliente (vedi claude-content-request.yml) — qui Claude ha
# accesso più ampio perché è sempre un umano con permessi di scrittura sul
# repo a invocarlo di persona.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
